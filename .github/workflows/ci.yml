name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]

    # The suite runs against real Postgres rather than a mock — that is the point
    # of it, since the locking behaviour under test is SKIP LOCKED semantics.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scheduler
          POSTGRES_PASSWORD: scheduler
          POSTGRES_DB: job_scheduler
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scheduler -d job_scheduler"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://scheduler:scheduler@localhost:5432/job_scheduler
      DATABASE_SSL: disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Apply schema
        run: npm run migrate

      - name: Migrations are idempotent
        run: npm run migrate

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - run: npm test

      - name: Build API
        run: npm run build

  web:
    name: Build dashboard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # `npm run build` in web/ is `tsc -b && vite build`, so this typechecks the
      # dashboard as well as bundling it.
      - run: npm run build
        working-directory: web

      - name: SPA rewrite rule is published
        run: test -f web/dist/_redirects
